name: Build iOS IPA & Widget

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA on macOS
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Archive LifeCountdownApp for iOS Device
        run: |
          xcodebuild -project LifeCountdownApp.xcodeproj \
                     -scheme LifeCountdownApp \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/LifeCountdownApp.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/LifeCountdownApp.xcarchive/Products/Applications/LifeCountdownApp.app Payload/
          zip -qr LifeCountdownApp.ipa Payload
          ls -lh LifeCountdownApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeCountdownApp-IPA
          path: LifeCountdownApp.ipa
          if-no-files-found: error
